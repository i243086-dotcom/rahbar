name: CI
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: make install && .venv/bin/pip install pytest-cov==6.1.1
      - run: .venv/bin/ruff check api indexer eval corpus
      - run: cd api && ../.venv/bin/mypy app
      - run: cd indexer && ../.venv/bin/mypy pipeline
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: make install && .venv/bin/pip install pytest-cov==6.1.1
      - run: cd api && ../.venv/bin/pytest -q --cov=app --cov-fail-under=60
      - run: cd indexer && ../.venv/bin/pytest -q
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -o pipefail
          kubectl kustomize k8s/overlays/prod |
            docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary -kubernetes-version 1.32.0
  build:
    needs: [lint, test, manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for component in api ui indexer; do
            docker build -t "rahbar-$component:dev" "$component"
          done
          docker save rahbar-api:dev rahbar-ui:dev rahbar-indexer:dev | gzip > /tmp/images.tar.gz
      - uses: actions/upload-artifact@v4
        with: {name: ci-images, path: /tmp/images.tar.gz, retention-days: 1}
  scan:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [api, ui, indexer]
    steps:
      - uses: actions/download-artifact@v4
        with: {name: ci-images, path: /tmp}
      - run: docker load -i /tmp/images.tar.gz
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: rahbar-${{ matrix.component }}:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  e2e-eval:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: helm/kind-action@v1.12.0
        with: {cluster_name: rahbar, node_image: 'kindest/node:v1.32.2'}
      - uses: actions/download-artifact@v4
        with: {name: ci-images, path: /tmp}
      - run: |
          pip install httpx==0.28.1 PyYAML==6.0.2
          docker load -i /tmp/images.tar.gz
          kind load docker-image --name rahbar rahbar-api:dev rahbar-ui:dev rahbar-indexer:dev
          EVAL_RUNNER=eval/run_eval.py bash scripts/ci-stack.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: fixture-evaluation, path: /tmp/rahbar-fixture-results.json}
      - if: failure()
        run: |
          kubectl get pods -A
          kubectl -n rahbar logs -l app=indexer --tail=60 || true
          kubectl -n rahbar logs -l app=api --tail=25 || true
