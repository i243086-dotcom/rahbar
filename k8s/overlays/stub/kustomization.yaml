apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target:
      kind: ConfigMap
      name: rahbar-config
    patch: |-
      - op: replace
        path: /data/RETRIEVER
        value: stub
      - op: replace
        path: /data/LLM_PROVIDER
        value: stub
      - op: replace
        path: /data/EMBED_MODEL
        value: dummy-768
  - target:
      kind: Job
      name: indexer
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args
        value: ["--dummy"]
  - target:
      kind: CronJob
      name: reindex
    patch: |-
      - op: add
        path: /spec/suspend
        value: true
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/args
        value: ["--dummy"]
