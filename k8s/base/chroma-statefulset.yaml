apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels: {app: chroma}
  template:
    metadata:
      labels: {app: chroma}
    spec:
      serviceAccountName: chroma
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12
          workingDir: /data
          env:
            - {name: CHROMA_PERSIST_PATH, value: /data}
            - {name: ANONYMIZED_TELEMETRY, value: "false"}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 1
              memory: 768Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 2Gi}
