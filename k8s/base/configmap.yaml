apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
data:
  RETRIEVER: chroma
  LLM_PROVIDER: ollama-host
  LLM_MODEL: llama3.2:3b
  LLM_NUM_CTX: "8192"
  LLM_TIMEOUT: "120"
  EMBED_MODEL: nomic-embed-text
  OLLAMA_URL: http://host.minikube.internal:11434
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: rahbar
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CACHE_ENABLED: "true"
  CACHE_THRESHOLD: "0.92"
  CACHE_TTL_SECONDS: "21600"
  CACHE_MAX_ENTRIES: "200"
  TOP_K: "1"
  FETCH_K: "20"
  RELEVANCE_FLOOR: "0.45"
  TEMPERATURE: "0.2"
  CHUNK_SIZE: "400"
  CHUNK_OVERLAP: "50"
  CORPUS_DIR: /corpus
